<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>打开 AdPilot 缺货处理</title>
<style>body{margin:0;background:#f4f7fc;font:15px/1.7 system-ui,sans-serif;color:#223650;display:grid;min-height:100vh;place-items:center}main{background:white;border:1px solid #e1e9f5;border-radius:18px;padding:32px;width:min(440px,80vw)}h1{font-size:24px;margin:0 0 10px}p{color:#64758b}button,a{display:inline-block;border:1px solid #dce5f2;border-radius:8px;padding:10px 16px;background:white;color:#1764cf;cursor:pointer;text-decoration:none;font:inherit}#launch{background:#1764cf;color:white}input{box-sizing:border-box;width:100%;margin:12px 0;padding:9px;border:1px solid #dce5f2;border-radius:6px;color:#64758b}small{display:block;color:#64758b;margin-top:18px}</style>
<main><h1>打开缺货处理</h1><p id="scope">正在检查提醒链接…</p><div id="actions" hidden><a id="launch">打开 AdPilot</a> <button id="copy">复制处理链接</button><input id="link" readonly aria-label="处理链接"><small>请在已安装 AdPilot 的 Windows 电脑上打开。若飞书内无法唤起，请从右上角菜单选择“在浏览器打开”，再点击上方按钮。也可以复制链接，在软件产品库的“打开提醒链接”中粘贴。</small><small>没有安装软件？<a href="https://github.com/Rachel-qjx/adpilot-desktop-releases/releases/latest" target="_blank" rel="noopener noreferrer">下载安装</a></small></div><p id="status" role="status"></p></main>
<script>
const q=new URLSearchParams(location.hash.slice(1)),store=q.get('store'),date=q.get('date');let valid=false;try{valid=/^[A-Za-z0-9_-]{1,80}$/.test(store||'')&&/^\d{4}-\d{2}-\d{2}$/.test(date||'')&&new Date(date+'T00:00:00Z').toISOString().slice(0,10)===date}catch{}
if(valid){const link='adpilot://products/shortage?store='+encodeURIComponent(store)+'&date='+encodeURIComponent(date);document.getElementById('scope').textContent='查询日期：'+date+' · 打开后按登录账号校验店铺权限';document.getElementById('actions').hidden=false;document.getElementById('launch').href=link;document.getElementById('link').value=link;document.getElementById('launch').onclick=()=>{document.getElementById('status').textContent='请在浏览器提示中允许打开 AdPilot。若没有反应，请使用下方备用方式。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('status').textContent='已复制，请到 AdPilot 产品库打开提醒链接。'}catch{document.getElementById('link').select();document.getElementById('status').textContent='请按 Ctrl+C 复制选中的链接。'}}}else document.getElementById('scope').textContent='提醒链接不完整或已损坏，请重新复制。';
</script></html>
